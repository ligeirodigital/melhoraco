name: Importar imagens do Lovable
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar imagens do site antigo
        run: |
          set -e
          base=https://melhoraco.lovable.app
          for f in favicon.ico icon-192.png icon-512.png placeholder.svg logo-original.jfif; do
            curl -fsSL "$base/$f" -o "sistema/public/$f"
            echo "$f: $(stat -c %s sistema/public/$f) bytes"
          done
          mkdir -p sistema/src/assets
          cp sistema/public/logo-original.jfif sistema/src/assets/logo.jfif
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add sistema/public sistema/src/assets
          git diff --cached --quiet || git commit -m "Importa imagens do site antigo"
          git push
